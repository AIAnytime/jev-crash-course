<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corner Shop</title>
<style>
  :root { --ink:#1e1e1e; --line:#e2ded6; --accent:#1971c2; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; color:var(--ink); background:#fbfaf7; }
  header { display:flex; justify-content:space-between; align-items:center; padding:18px 28px; border-bottom:1px solid var(--line); background:#fff; }
  header h1 { font-size:20px; margin:0; }
  #basket { font-size:15px; }
  main { max-width:760px; margin:0 auto; padding:28px; }
  .item { display:flex; justify-content:space-between; align-items:center; background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .item b { display:block; }
  .item span { color:#6b6b6b; font-size:14px; }
  button { font:600 15px system-ui; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:11px 18px; cursor:pointer; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  form { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; margin-top:24px; }
  label { display:block; font-size:13px; color:#6b6b6b; margin:12px 0 5px; }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  #message { margin-top:18px; padding:14px 16px; border-radius:8px; font-size:15px; display:none; }
  #message.error { background:#fbeaea; color:#c92a2a; }
  #message.raw { background:#f4f1eb; color:#1e1e1e; font-family:ui-monospace, monospace; font-size:13px; }
  #message.ok { background:#e7f6ea; color:#2f9e44; }
</style>
</head>
<body>
<header>
  <h1>Corner Shop</h1>
  <div id="basket">Basket: <b id="count">0</b> items</div>
</header>
<main>
  <div class="item"><div><b>Filter coffee, 1kg</b><span>ground, medium roast</span></div><button data-add="coffee">Add to basket</button></div>
  <div class="item"><div><b>Oat milk, 6 pack</b><span>barista edition</span></div><button data-add="oat">Add to basket</button></div>
  <div class="item"><div><b>Paper filters, 100</b><span>size 4</span></div><button data-add="filters">Add to basket</button></div>

  <form id="checkout">
    <h2 style="margin:0;font-size:17px">Checkout</h2>
    <label for="email">Email address</label>
    <input id="email" name="email" placeholder="you@example.com">
    <label for="card">Card number</label>
    <input id="card" name="card" placeholder="4242 4242 4242 4242">
    <div style="margin-top:18px"><button id="pay" type="submit">Pay now</button></div>
    <div id="message"></div>
  </form>
</main>
<script>
  const broken = new URLSearchParams(location.search).get("bug") === "1";
  let count = 0;

  document.querySelectorAll("[data-add]").forEach((b) => {
    b.onclick = () => {
      count += 1;
      // In the broken build the basket total is only written on the second add.
      if (!broken || count !== 1) document.getElementById("count").textContent = count;
    };
  });

  document.getElementById("checkout").onsubmit = (e) => {
    e.preventDefault();
    const box = document.getElementById("message");
    const email = document.getElementById("email").value;
    box.style.display = "block";
    if (!email.trim()) {
      if (broken) {
        box.className = "raw";
        box.textContent = "TypeError: Cannot read properties of undefined (reading 'trim') at submitOrder (checkout.bundle.js:1:24817)";
      } else {
        box.className = "error";
        box.textContent = "Please enter your email address so we can send your receipt.";
      }
      return;
    }
    box.className = "ok";
    box.textContent = "Thank you. Your order is confirmed and a receipt is on its way.";
  };
</script>
</body>
</html>
